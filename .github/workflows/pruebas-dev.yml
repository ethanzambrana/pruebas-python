name: Pruebas automatizadas en dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test_app:
    name: Ejecutar pruebas Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar el entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar las pruebas
        run: |
          python -m pytest --rootdir=.

      - name: Reporte final
        if: always()
        run: echo "Pruebas finalizadas. Verifica el resultado del job."
